<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simorgh</title>
  <meta name="description" content="Point your phone at the photograph: the Simorgh hangs between the pillars, held in two projector beams.">
  <meta name="theme-color" content="#04060f">
  <!-- 8th Wall engine (Niantic Spatial): world tracking + image targets. See lib/8thwall/LICENSE. -->
  <script src="./lib/8thwall/xr.js" async data-preload-chunks="slam"></script>
  <script src="./lib/xrextras/xrextras.js"></script>
  <!-- The Turrell shade: the camera view dims to 55%, turns deep blue, and its light flickers -->
  <script src="./shade.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/build/three.module.js",
        "three/addons/": "./lib/three/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #04060f;
      --ink: #e6ecff;
      --muted: #8d9cc4;
      --beam: #7fa6ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }

    .setup {
      min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(120% 70% at 50% 0%, #0d1a46 0%, var(--bg) 62%);
      text-align: center;
    }
    .photo { position: relative; width: min(46vw, 210px); aspect-ratio: 721 / 1280; margin: 0; }
    .photo img {
      width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4px;
      filter: saturate(0.6) brightness(0.8);
      box-shadow: 0 0 0 1px rgba(127, 166, 255, 0.25), 0 18px 60px rgba(40, 80, 255, 0.35);
    }
    h1 { margin: 0; font-weight: 300; font-size: 30px; letter-spacing: 0.32em; text-transform: uppercase; padding-left: 0.32em; }
    .lead { margin: 0; max-width: 30ch; color: var(--muted); }
    .start {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 34px; min-width: 200px;
      font: inherit; font-weight: 600; letter-spacing: 0.04em; color: #050a1c; background: var(--ink);
      box-shadow: 0 0 32px rgba(127, 166, 255, 0.55); cursor: pointer;
    }
    .start:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
    .status { margin: -8px 0 0; min-height: 1.5em; font-size: 14px; color: var(--muted); }
    .error { margin: 0; max-width: 34ch; color: #ffb0a8; font-size: 14px; }
    .credit { margin: 8px 0 0; max-width: 40ch; font-size: 11px; color: #5d6a90; }
    .credit a { color: inherit; }

    .ar { position: fixed; inset: 0; pointer-events: none; }   /* taps go through to the camera view */
    #xr-canvas { display: none; }
    .hint {
      position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translateX(-50%);
      z-index: 10; margin: 0; padding: 8px 16px; border-radius: 999px; white-space: nowrap;
      font-size: 14px; color: var(--ink); background: rgba(6, 12, 34, 0.72);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      transition: opacity 0.6s;
    }
    .hint.found { opacity: 0; pointer-events: none; }
    .back {
      position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10;
      width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center;
      color: var(--ink); background: rgba(6, 12, 34, 0.6); cursor: pointer; pointer-events: auto;
    }
  </style>
</head>
<body data-state="setup">

  <main class="setup" id="setup">
    <figure class="photo"><img src="atrium.jpg" alt="The photograph to point at: a concrete atrium between tall pillars"></figure>
    <h1>Simorgh</h1>
    <p class="lead">Point your phone at this view: the photograph, or the atrium itself.</p>
    <button class="start" id="start" type="button" disabled>Start camera</button>
    <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
    <p class="error" id="error" role="alert" hidden></p>
    <p class="credit">AR engine: 8th Wall © Niantic Spatial, Inc., used under its <a href="lib/8thwall/LICENSE" target="_blank" rel="noopener">engine license</a>, provided without warranty.</p>
  </main>

  <section class="ar" id="ar" aria-label="Camera view" hidden>
    <p class="hint" id="hint">Starting camera…</p>
    <button class="back" id="back" type="button" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
    </button>
    <canvas id="xr-canvas"></canvas>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
